<!DOCTYPE html>
<html>
    {{template "head" .}}
    <body>
        <main>
            {{if eq .BlockName "form"}}
                {{template "form" .}}
            {{else if eq .BlockName "result"}} 
                {{template "result" .}}
            {{else}}
                <p>Loading</p>
            {{end}}
        </main>
    </body>
</html>
